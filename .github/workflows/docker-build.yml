name: Build and Push Docker Images

on:
  push:
    branches: [ main, staging, development ]
  pull_request:
    # Build (zonder push) op PR's tegen alle release-branches, zodat
    # Dockerfile-/dep-wijzigingen vóór merge worden gevalideerd.
    # Push step respecteert al `github.event_name != 'pull_request'`.
    branches: [ main, development, staging ]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build (e.g. main, staging, v1.2.0)'
        required: true
        default: 'staging'

env:
  REGISTRY: docker.io
  IMAGE_NAME: mwest2020/openanonymiser-light

jobs:
  test:
    name: Unit tests (required before build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        # GLiNER-only: gliner (+torch) in de base-deps; geen gpu-extra.
        run: uv sync --group dev

      - name: Start API
        run: |
          DEFAULT_SPACY_MODEL=nl_core_news_lg uv run api.py &
          echo "API_PID=$!" >> $GITHUB_ENV

          # Wait for API to be ready. GLiNER-only laadt torch + het GLiNER-model
          # (eerste keer incl. HF-download) → ruim window (max 300s).
          for i in {1..300}; do
            if curl -s http://localhost:8080/api/v1/health | grep -q pong; then
              echo "API is ready"
              exit 0
            fi
            if [ $((i % 15)) -eq 0 ]; then
              echo "Waiting for API... ($i/300)"
            fi
            sleep 1
          done
          echo "API failed to start within 300 seconds"
          exit 1

      - name: Run tests
        run: uv run pytest tests/ -q

      - name: Stop API
        if: always()
        run: kill $API_PID || true

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Determine version and tags
        id: meta
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [[ -z "$REF" ]]; then
            REF="${GITHUB_REF#refs/heads/}"
          fi
          echo "Using REF=$REF"

          # GLiNER-only: één image, geen flavor-suffix.
          #   main      → :latest + :main (+ laatste git-tag)
          #   staging   → :acc
          #   develop.  → :dev
          if [[ "$REF" == "main" ]]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.3.0")
            TAGS="${{ env.IMAGE_NAME }}:${VERSION},${{ env.IMAGE_NAME }}:latest,${{ env.IMAGE_NAME }}:main"
          elif [[ "$REF" == "staging" ]]; then
            VERSION="acc"
            TAGS="${{ env.IMAGE_NAME }}:acc"
          elif [[ "$REF" == "development" ]]; then
            VERSION="dev"
            TAGS="${{ env.IMAGE_NAME }}:dev"
          elif [[ "$REF" == v* ]]; then
            VERSION="${REF}"
            TAGS="${{ env.IMAGE_NAME }}:${REF}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
            TAGS="${{ env.IMAGE_NAME }}:dev"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "📦 Building version=${VERSION}" >> $GITHUB_STEP_SUMMARY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build naar de runner (load: true), nog niet pushen — dan kan
      # Trivy de gebouwde image scannen voordat hij in de registry komt.
      - name: Build image (load to runner for scan)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          load: true
          tags: scan-target:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy CVE-scan op OS-packages + Python wheels in de venv.
      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table
          vuln-type: os,library

      # Tweede build is instant door GHA-cache uit eerste step.
      - name: Push image to registry
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Image pushed summary
        if: github.event_name != 'pull_request'
        run: |
          echo "🚀 **Docker image pushed to Docker Hub (GLiNER-only):**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          IFS=',' read -ra TAG_ARRAY <<< "${{ steps.meta.outputs.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            echo "- \`${tag}\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Version:** \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
