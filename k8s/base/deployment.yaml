apiVersion: apps/v1
kind: Deployment
metadata:
  name: openanonymiser
  labels:
    app: openanonymiser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openanonymiser
  template:
    metadata:
      labels:
        app: openanonymiser
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: openanonymiser
          image: ghcr.io/mwest2020/openanonymiser-light:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: openanonymiser-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            # GLiNER-only: torch + spaCy-lg + GLiNER-model ≈ 3-4 GiB resident.
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "6Gi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Model laadt bij startup (~1-3 min op CPU) → startupProbe geeft de tijd
          # vóór readiness/liveness streng worden.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
