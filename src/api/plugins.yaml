# OpenAnonymiser plugin configuratie — TEXT-ONLY default (strip-to-text-only).
# SpaCy NER + regex-patterns, CPU-only. Geen GLiNER, geen transformer-engine,
# geen torch/CUDA. Doelgroep: slanke sidecar / Nextcloud-app / on-prem appliance.
# De GLiNER/GPU-variant leeft in plugins.gpu.yaml (kies via PLUGINS_CONFIG).
#
# Voeg nieuwe recognizers toe zonder Python-code te schrijven.
# Zet enabled: false om een module tijdelijk uit te schakelen.
#
# Ondersteunde typen:
#   pattern     — PatternRecognizer subclasses uit src/api/utils/patterns.py
#   spacy       — SpaCy NER (NER-engine; altijd precies één entry)

language: nl

ner:
  type: spacy
  # Default = lg voor lokale dev (CLAUDE.md-regel). Containers zetten
  # DEFAULT_SPACY_MODEL=nl_core_news_md in de image-env (alleen md is gebakken).
  model: ${DEFAULT_SPACY_MODEL:-nl_core_news_lg}
  entities: [DATE, FAC, GPE, LOC, MONEY, NORP, ORG, PERSON]
  ner_strength: 0.85
  enabled: true

# Context-aware enhancement: boost confidence via omringende woorden.
context_aware_enhancer:
  enabled: false
  context_similarity_factor: 0.35
  min_score_with_context_similarity: 0.4

recognizers:
  - name: DutchPhoneNumberRecognizer
    type: pattern
    enabled: true

  - name: DutchIBANRecognizer
    type: pattern
    enabled: true

  - name: DutchBSNRecognizer
    type: pattern
    enabled: true

  - name: DutchDateRecognizer
    type: pattern
    enabled: true

  - name: EmailRecognizer
    type: pattern
    enabled: true

  - name: DutchPassportIdRecognizer
    type: pattern
    enabled: true

  - name: DutchDriversLicenseRecognizer
    type: pattern
    enabled: true

  - name: DutchVATRecognizer
    type: pattern
    enabled: true

  - name: DutchKvKRecognizer
    type: pattern
    enabled: true

  - name: DutchLicensePlateRecognizer
    type: pattern
    enabled: true

  - name: IPv4Recognizer
    type: pattern
    enabled: true

  - name: CaseNumberRecognizer
    type: pattern
    enabled: true

  - name: MACAddressRecognizer
    type: pattern
    enabled: true
